name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" \
          --health-interval 5s \
          --health-timeout 5s \
          --health-retries 5
    env:
      ConnectionStrings__Db: Host=postgres;Database=postgres;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify formatting
        run: dotnet format --verify-no-changes || (echo "Code not formatted. Run 'dotnet format' or 'make format' locally." && exit 1)
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory ./TestResults \
          /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=./TestResults/coverage/ \
          /p:Threshold=70 /p:ThresholdType=line /p:ThresholdStat=total
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: test-results
            path: TestResults
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: TestResults/coverage
      - name: Generate Coverage Summary
        run: |
          dotnet new tool-manifest || true
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.3.7 || true
          reportgenerator -reports:TestResults/coverage/**/*.xml -targetdir:TestResults/coverage-report -reporttypes:MarkdownSummary;TextSummary
          echo "--- Coverage Summary ---"
          cat TestResults/coverage-report/Summary.txt || true
      - name: Upload Coverage Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: TestResults/coverage-report
      - name: Upload to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: TestResults/coverage/**/*.xml
          fail_ci_if_error: false
          verbose: false

  docker-images:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agenthost-api:latest
            ghcr.io/${{ github.repository_owner }}/agenthost-api:${{ github.sha }}
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agenthost-worker:latest
            ghcr.io/${{ github.repository_owner }}/agenthost-worker:${{ github.sha }}
